name: Release

# Push a tag like v0.1.0: tests, a GitHub release with the wheel, and — once the repository
# variable PYPI is "true" — PyPI via trusted publishing (no token stored here; the project on
# pypi.org must list this repository and workflow as a trusted publisher).
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Tests
        run: uv sync --group dev && uv run pytest
      - name: Version matches the tag
        run: |
          version=$(uv run python -c "import diga; print(diga.__version__)")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME ≠ version $version"; exit 1; }
      - name: Build
        run: uv build
      - uses: actions/upload-artifact@v7
        with: {name: dist, path: dist/}

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing
      contents: write  # GitHub release
    steps:
      - uses: actions/download-artifact@v4
        with: {name: dist, path: dist/}
      - if: vars.PYPI == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: GitHub release
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
